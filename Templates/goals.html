{% extends "base.html" %}

{% block title %}Goals - MindPal{% endblock %}

{% block extra_head %}
<style>
.goals-container .container {
    max-width: 800px;
}

#goal-form-section {
    background: var(--white);
    padding: 2rem;
    border-radius: var(--radius-large);
    box-shadow: var(--shadow-light);
    margin-bottom: 2rem;
}

[data-theme="dark"] #goal-form-section {
    background: var(--medium-gray);
}

#goal-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.form-label {
    font-weight: var(--font-weight-medium);
    margin-bottom: 0.5rem;
}

.form-control {
    width: 100%;
    padding: 1rem;
    border-radius: var(--radius-medium);
    border: 1px solid var(--medium-gray);
    background: var(--light-gray);
    color: var(--text-color);
    transition: var(--transition-medium);
}

[data-theme="dark"] .form-control {
    background: var(--dark-gray);
    border-color: var(--medium-gray);
}

.form-control:focus {
    outline: none;
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
}

#goals-list-section {
    background: var(--white);
    padding: 2rem;
    border-radius: var(--radius-large);
    box-shadow: var(--shadow-light);
}

[data-theme="dark"] #goals-list-section {
    background: var(--medium-gray);
}

.list-group {
    list-style: none;
    padding: 0;
}

.list-group-item {
    background: var(--light-gray);
    padding: 1rem 1.5rem;
    border-radius: var(--radius-medium);
    margin-bottom: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: var(--transition-medium);
    border: 1px solid var(--medium-gray);
}

[data-theme="dark"] .list-group-item {
    background: var(--dark-gray);
    border-color: var(--medium-gray);
}

.list-group-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-light);
}

.list-group-item span {
    flex-grow: 1;
    margin-right: 1rem;
}

.list-group-item div {
    display: flex;
    gap: 0.5rem;
}

.btn-success {
    background-color: var(--accent-teal);
    color: var(--white);
}

[data-theme="dark"] .btn-success {
    color: var(--black);
}

.btn-danger {
    background-color: #f5576c;
    color: var(--white);
}

[data-theme="dark"] .btn-danger {
    color: var(--black);
}
</style>
{% endblock %}

{% block content %}
<main class="goals-container">
  <div class="container">
    <h1 style="padding-top: 50px; padding-bottom: 30px;">Goal Setting & Tracking</h1>
    <p>Set and track your personal and academic goals.</p>
    <section id="goal-form-section">
      <form id="goal-form">
        <div class="mb-3">
          <label for="goal-input" class="form-label">Add a new goal:</label>
          <input type="text" id="goal-input" class="form-control" placeholder="Enter your goal..." required>
        </div>
        <button type="submit" class="btn btn-primary">Add Goal</button>
      </form>
    </section>

    <section id="goals-list-section" style="margin-top:2rem;">
      <h2>Your Goals</h2>
      <ul id="goals-list" class="list-group">
        <!-- Goals will appear here -->
      </ul>
    </section>

    <script>
      // Simple local goal tracking (client-side only)
      const goalForm = document.getElementById('goal-form');
      const goalInput = document.getElementById('goal-input');
      const goalsList = document.getElementById('goals-list');

      // Load goals from localStorage
      function loadGoals() {
        const goals = JSON.parse(localStorage.getItem('goals') || '[]');
        goalsList.innerHTML = '';
        goals.forEach((goal, idx) => {
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';
          li.innerHTML = `
            <span>${goal.completed ? '<s>' + goal.text + '</s>' : goal.text}</span>
            <div>
              <button class="btn btn-success btn-sm me-2" onclick="completeGoal(${idx})">${goal.completed ? 'Undo' : 'Complete'}</button>
              <button class="btn btn-danger btn-sm" onclick="deleteGoal(${idx})">Delete</button>
            </div>
          `;
          goalsList.appendChild(li);
        });
      }

      // Add new goal
      goalForm.onsubmit = function(e) {
        e.preventDefault();
        const text = goalInput.value.trim();
        if (!text) return;
        const goals = JSON.parse(localStorage.getItem('goals') || '[]');
        goals.push({ text, completed: false });
        localStorage.setItem('goals', JSON.stringify(goals));
        goalInput.value = '';
        loadGoals();
      };

      // Complete/undo goal
      window.completeGoal = function(idx) {
        const goals = JSON.parse(localStorage.getItem('goals') || '[]');
        goals[idx].completed = !goals[idx].completed;
        localStorage.setItem('goals', JSON.stringify(goals));
        loadGoals();
      };

      // Delete goal
      window.deleteGoal = function(idx) {
        const goals = JSON.parse(localStorage.getItem('goals') || '[]');
        goals.splice(idx, 1);
        localStorage.setItem('goals', JSON.stringify(goals));
        loadGoals();
      };

      // Initial load
      loadGoals();
    </script>
  </div>
</main>
{% endblock %}
